name: Build and release APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # The build derives its version code and name from Git history and tags.
          fetch-depth: 0

      - name: Set build version
        id: version
        shell: bash
        run: |
          release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$release_tag" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 ndk;28.2.13676358"

      - name: Set up signing keys
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          CRASHREPORTING_FILE: ${{ secrets.CRASHREPORTING_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            ./setUpPropertiesCI.sh
          else
            echo "No release keystore configured; using the debug signing key"
          fi

      - name: Build release APK
        run: ./gradlew assembleStableRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          archive: false

  release:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download built APKs
        uses: actions/download-artifact@v8
        with:
          pattern: '*.apk'
          path: release-assets
          merge-multiple: true
          # APKs are ZIP files, but must remain intact for installation.
          skip-decompress: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [ "$(cat release-state.txt)" = "false" ]; then
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Wisp Keyboard $RELEASE_TAG" \
              --generate-notes --draft
          fi
          # Publish only after every APK and checksum has been attached successfully.
          gh release edit "$RELEASE_TAG" --draft=false --latest
