name: Attach release files

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 ndk;28.2.13676358"

      - name: Set up signing keys
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          CRASHREPORTING_FILE: ${{ secrets.CRASHREPORTING_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            ./setUpPropertiesCI.sh
          else
            echo "No release keystore configured; using the debug signing key"
          fi

      - name: Build release APK
        env:
          VERSION_NAME: ${{ github.event.release.tag_name }}
        run: ./gradlew assembleStableRelease

      - name: Generate checksums
        working-directory: build/outputs/apk/stable/release
        run: sha256sum *.apk > SHA256SUMS.txt

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          build/outputs/apk/stable/release/*.apk
          build/outputs/apk/stable/release/SHA256SUMS.txt
          --clobber
