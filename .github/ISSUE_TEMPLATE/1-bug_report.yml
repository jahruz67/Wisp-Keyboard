name: Bug Report
description: Let us know about an unexpected error, a crash, or an incorrect behavior.
labels: ["Bug"]
title: "Bug: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        # Thank you for taking the time to fill out this bug report.

        This tracker is for Wisp Keyboard, an independent fork. For bugs in the upstream FUTO Keyboard app, use the upstream project instead.

        Please open one bug per issue so each problem can be reproduced and tracked clearly.

        ## Filing a bug report

        To fix your issues faster, we need clear reproduction cases - ideally allowing us to make it happen locally.
        * Please include all needed context. For example, Device, OS, Application, any relevant settings.
        * If you've found a particular series of interactions can introduce buggy behavior, please label those steps 1-n with markdown

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Please provide us with the steps to reproduce the issue if possible. This step makes a big difference if we are going to be able to fix it so be as precise as possible.
      placeholder: |
        1. Open KDE Connect application
        2. Go to its settings and tap on "Device name"
        3. Keep pressing backspace until text starts duplicating itself
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What happend? You may want to include a video recording of the issue.
      placeholder: Tell us what you saw!
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What was suppose to happen?
      placeholder: Tell us what you expected to happen!
    validations:
      required: true

  - type: input
    id: keyboard-version
    attributes:
      label: Keyboard Version
      description: Open Wisp Keyboard settings and look for the version at the bottom or in Help & Feedback.
      placeholder: "0.1.22"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Which android version are you using?
      placeholder: "Android 15"
    validations:
      required: true

  - type: input
    id: phone-model
    attributes:
      label: Which device are you using?
      placeholder: "Google Pixel 9"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Which operating system are you using?
      placeholder: "GrapheneOS/CalyxOS/Tizen/HyperOS 2/..."
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Are there any other GitHub issues, whether open or closed, that are related to the problem you've described above? If so, please create a list below that mentions each of them. For example:
        ```
          - #10
          - #25
        ```
      placeholder:
      value:
    validations:
      required: false
